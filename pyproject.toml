[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idevice-fleet"
dynamic = ["version"]
description = "Local web UI for restoring and backing up many iPhones and iPads with libimobiledevice"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
idevice-fleet = "idevice_fleet.__main__:main"

[project.urls]
Homepage = "https://github.com/Maxjr2/idevice-fleet"

[tool.setuptools]
packages = ["idevice_fleet"]

[tool.setuptools.dynamic]
version = { attr = "idevice_fleet.__version__" }

[tool.setuptools.package-data]
idevice_fleet = ["web/*"]
